name: Build and deploy Github pages
on:
  push:
    branches:
      - main
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  deploy-latest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install relife with doc dependencies
        run: python -m pip install . --group dev

      - name: Configure git identity for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy latest (dev) docs
        run: mike deploy latest --push --update-aliases -F docs/zensical.toml

      - name: Save website as an artifact
        uses: actions/upload-artifact@v6
        with:
          name: website
          path: ./docs/site
          retention-days: 14

  deploy-versions:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # need full history and all tags

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install relife with doc dependencies
        run: python -m pip install . --group dev

      - name: Configure git identity for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy retained tagged versions and prune stale ones
        run: python docs/deploy_versions.py
